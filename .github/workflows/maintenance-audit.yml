name: Controlled Maintenance Audit

on:
  schedule:
    - cron: '37 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coursecompass-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture dependency advisory report
        run: npm audit --omit=dev --json > release-assets/reports/npm-audit.json || true
      - name: Enforce high-severity production dependency policy
        run: npm audit --omit=dev --audit-level=high
      - name: Capture available dependency updates
        run: npm outdated --json > release-assets/reports/npm-outdated.json || true
      - name: Check course, license, content, and release freshness
        run: npm run maintenance:report
      - name: Run complete release automation
        run: npm run verify:release
      - name: Upload immutable maintenance review package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-review-${{ github.run_number }}
          path: release-assets/reports/
          retention-days: 30
          if-no-files-found: error

