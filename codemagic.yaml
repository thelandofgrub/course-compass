workflows:
  coursecompass-native-validation:
    name: CourseCompass native validation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      xcode: 26.4
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        PUPPETEER_SKIP_DOWNLOAD: "true"
    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
        - ~/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install locked dependencies
        script: npm ci --prefer-offline --no-audit
      - name: Run repository release checks
        script: |
          npm run maintenance:release
          npm test
          npm run test:course-data
          npm run test:calibration
          npm run test:release-static
      - name: Synchronize Capacitor projects
        script: npx cap sync
      - name: Configure Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace
      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/ios/App/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - ios/App/build/Build/Products/Debug-iphonesimulator/*.app
      - release-assets/reports/*.json
      - release-assets/reports/*.md
      - /tmp/xcodebuild_logs/*.log
